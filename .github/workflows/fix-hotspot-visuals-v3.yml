name: Apply direct hotspot visual cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-hotspot-visuals-v3.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hotspot visual classes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/CroftManor.tsx')
          text = path.read_text()
          replacements = [
            'group-hover:bg-amber-400/10',
            'group-hover:bg-amber-400/20',
            'group-hover:bg-amber-400/25',
            'group-hover:bg-cyan-400/15',
            'group-hover:border-2',
            'group-hover:border',
            'group-hover:border-amber-400/30',
            'group-hover:border-amber-400/60',
            'group-hover:border-amber-400/70',
            'group-hover:border-cyan-400/50',
          ]
          counts = {item: text.count(item) for item in replacements}
          for item in replacements:
              text = text.replace(item, '')
          text = text.replace('opacity-0 group-hover:opacity-100 group-focus:opacity-100', 'hidden')
          path.write_text(text)
          print(counts)
          print('changed:', any(counts.values()))
          PY
      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CroftManor.tsx
          git rm .github/workflows/fix-hotspot-visuals-v3.yml
          git commit -m "Remove visible hotspot frames and labels"
          git push
