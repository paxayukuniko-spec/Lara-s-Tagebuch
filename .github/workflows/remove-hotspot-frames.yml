name: Remove visible hotspot frames

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-hotspot-frames.yml

permissions:
  contents: write

jobs:
  remove-frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove hotspot overlays while keeping click targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/components/CroftManor.tsx')
          text = path.read_text()
          cleaned = re.sub(r'group-hover:bg-(?:amber|cyan)-400/\\d+ group-hover:border-2 group-hover:border-(?:amber|cyan)-400/\\d+ ', '', text)
          if cleaned == text:
              print('No visible hotspot frame classes found')
          else:
              path.write_text(cleaned)
          PY
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CroftManor.tsx
          git rm .github/workflows/remove-hotspot-frames.yml
          git commit -m "Remove visible hotspot frames" || exit 0
          git push
