name: Hide hotspot labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-hotspot-labels.yml

permissions:
  contents: write

jobs:
  hide-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hide visual hotspot labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/CroftManor.tsx')
          text = path.read_text()
          old = 'className="w-full h-full rounded transition-all duration-300 flex items-center justify-center opacity-0 group-hover:opacity-100 group-focus:opacity-100"'
          new = 'className="hidden"'
          changed = text.count(old)
          path.write_text(text.replace(old, new))
          print(f'Hidden hotspot labels: {changed}')
          PY
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CroftManor.tsx
          git rm .github/workflows/remove-hotspot-labels.yml
          git commit -m "Hide hotspot labels and keep click areas" || exit 0
          git push
